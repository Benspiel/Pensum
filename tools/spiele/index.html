<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Spiele – Pensum</title>
  <meta name="description" content="Spiele für die Pause: Arcade-Action und kleine Herausforderungen, direkt im Browser und mit Touch spielbar.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/assets/favicon.png" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preload" href="/vendor/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/vendor/fonts.css">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/pensum.css">
  <link rel="stylesheet" href="/tools/spiele/spiele.css">
  <script type="module" src="/js/shell.js"></script>
  <script type="module" src="/tools/spiele/spiele.js"></script>
</head>
<body>
  <a class="skip-link" href="#inhalt">Zum Inhalt springen</a>
  <pensum-nav></pensum-nav>

  <!-- Übersicht: große Kacheln mit kleiner Vorschau -->
  <main id="menu" class="container">
    <header class="tool-head">
      <h1>Spiele.</h1>
      <p class="muted">Eine kleine Pause? Such dir ein Spiel aus.</p>
    </header>

    <section class="panel on-tint sp-soon" id="soon" hidden aria-live="polite">
      <h2 class="h4">Kommt bald.</h2>
      <p class="body-sm muted-tint">Die Spiele sind noch nicht freigeschaltet. Schau bald wieder vorbei.</p>
      <a class="btn btn-primary" href="/">Zur Startseite</a>
    </section>

    <div id="gameCatalog" hidden>
      <div class="sg-discover">
        <label class="sg-search"> <span class="sr-only">Spiele suchen</span><input id="gameSearch" type="search" placeholder="Spiel suchen …" autocomplete="off"></label>
        <div class="sg-filters" id="gameFilters" aria-label="Kategorie wählen"></div>
      </div>
      <p class="sg-external-note">Direkt hier spielen – mit Touch oder Tastatur.</p>
      <nav class="sg-tiles sg-catalog" id="externalGames" aria-label="Spiele entdecken"></nav>
      <p id="noGames" hidden>Kein Spiel gefunden. Versuch einen anderen Suchbegriff.</p>
    </div>
    <p class="body-sm muted sg-credits" id="credits"></p>
  </main>

  <!-- Spielansicht: nur das Spiel unter der Nav, ohne Knöpfe -->
  <section class="sg-play" id="play" hidden aria-label="Spiel">
    <div class="chips-row sp-chips" id="chips" aria-live="polite"></div>
    <div class="sp-frame" id="frame">
      <div class="sp-stage" id="stage"></div>
      <div class="sp-controls touch-only" id="controls"></div>
      <div class="sp-overlay" id="overlay" hidden role="status">
        <div class="sp-overlay-box">
          <p class="h4" id="overlayTitle"></p>
          <p class="body-sm muted" id="overlayText"></p>
          <button class="btn btn-primary" type="button" id="overlayBtn">Nochmal</button>
        </div>
      </div>
    </div>
  </section>

  <pensum-footer></pensum-footer>
</body>
</html>
